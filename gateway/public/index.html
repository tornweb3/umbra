<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XMR Gateway</title>
<style>
body{font-family:system-ui,sans-serif;max-width:860px;margin:30px auto;padding:0 16px}
section{border:1px solid #ddd;border-radius:8px;padding:16px 20px;margin-bottom:24px}
label{display:block;margin-top:10px;font-size:14px}
input{width:100%;padding:6px 8px;margin-top:2px;box-sizing:border-box;font-family:monospace}
button{margin-top:12px;padding:8px 18px;cursor:pointer}
pre{background:#f4f4f4;padding:10px;border-radius:6px;white-space:pre-wrap;word-break:break-all;font-size:12px}
table{border-collapse:collapse;width:100%;font-size:13px;margin-top:12px}
th,td{border:1px solid #ddd;padding:6px 8px;text-align:left}
.badge{padding:2px 8px;border-radius:10px;font-size:12px}
.pending{background:#fff3cd}.detected{background:#cfe2ff}.confirmed{background:#d1e7dd}.expired{background:#f8d7da}
</style>
</head>
<body>
<h1>XMR Payment Gateway</h1>

<section>
<h2>1. Merchant signup</h2>
<label>Name <input id="m-name" placeholder="My Shop"></label>
<label>Monero address (mainnet, starts with 4) <input id="m-address"></label>
<label>Private view key (64 hex) <input id="m-viewkey"></label>
<label>Webhook URL <input id="m-webhook" placeholder="http://127.0.0.1:4000/hook"></label>
<button onclick="signup()">Create merchant</button>
<pre id="m-result"></pre>
</section>

<section>
<h2>API key (from signup — used by the sections below)</h2>
<label>API key <input id="api-key" placeholder="xmr_sk_..."></label>
</section>

<section>
<h2>2. Create invoice</h2>
<label>Amount (XMR) — leave empty if using fiat <input id="i-amount" placeholder="0.01"></label>
<label>Fiat amount <input id="i-fiat" placeholder="5.00"></label>
<label>Fiat currency (USD or EUR) <input id="i-cur" placeholder="USD"></label>
<label>Description <input id="i-desc" placeholder="optional"></label>
<button onclick="createInvoice()">Create invoice</button>
<pre id="i-result"></pre>
</section>

<section>
<h2>3. Dashboard</h2>
<button onclick="loadDashboard()">Load invoices</button>
<div id="d-table"></div>
</section>

<script>
function key(){ return document.getElementById('api-key').value.trim(); }
async function post(url, body){
  const r = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key()},body:JSON.stringify(body)});
  const j = await r.json();
  if(!r.ok) throw new Error(j.error || r.status);
  return j;
}
async function signup(){
  const out = document.getElementById('m-result');
  out.textContent = '...';
  try{
    const r = await fetch('/api/merchants',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      name: document.getElementById('m-name').value.trim(),
      address: document.getElementById('m-address').value.trim(),
      view_key: document.getElementById('m-viewkey').value.trim(),
      webhook_url: document.getElementById('m-webhook').value.trim(),
    })});
    const j = await r.json();
    if(!r.ok) throw new Error(j.error || r.status);
    out.textContent = JSON.stringify(j,null,2);
    document.getElementById('api-key').value = j.api_key;
  }catch(e){out.textContent = 'Error: '+e.message}
}
async function createInvoice(){
  const out = document.getElementById('i-result');
  out.textContent = '...';
  try{
    const body = { description: document.getElementById('i-desc').value.trim() };
    const xmr = document.getElementById('i-amount').value.trim();
    const fiat = document.getElementById('i-fiat').value.trim();
    if(xmr) body.amount_xmr = xmr;
    else { body.price_amount = fiat; body.price_currency = document.getElementById('i-cur').value.trim().toUpperCase(); }
    const j = await post('/api/invoices', body);
    out.innerHTML = JSON.stringify(j,null,2) +
      '\n\n<a href="'+j.checkout_url+'" target="_blank">Open checkout page</a>';
  }catch(e){out.textContent = 'Error: '+e.message}
}
let dashTimer = null;
async function loadDashboard(){
  const r = await fetch('/api/me/invoices',{headers:{'Authorization':'Bearer '+key()}});
  const rows = await r.json();
  const el = document.getElementById('d-table');
  if(!r.ok){el.textContent = 'Error: '+(rows.error||r.status); return}
  el.innerHTML = '<table><tr><th>Invoice</th><th>Due (XMR)</th><th>Received</th><th>Fiat</th><th>Conf</th><th>Status</th><th>Expires</th><th></th></tr>' +
    rows.map(i => '<tr><td>'+i.id.slice(0,8)+'…</td><td>'+i.amount_due_xmr+'</td><td>'+i.amount_received_xmr+
      '</td><td>'+(i.price_amount ? i.price_amount+' '+i.price_currency : '—')+
      '</td><td>'+i.confirmations+'</td><td><span class="badge '+i.status+'">'+i.status+
      '</span></td><td>'+new Date(i.expires_at).toLocaleString()+
      '</td><td><a href="/checkout/'+i.id+'" target="_blank">checkout</a></td></tr>').join('') + '</table>';
  clearTimeout(dashTimer);
  dashTimer = setTimeout(loadDashboard, 10000);
}
</script>
</body>
</html>
